<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profit and Loss Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h2 { text-align: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #333; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        tfoot td { font-weight: bold; }
    </style>
</head>
<body>

<h2 th:text="${reportTitle}">Profit and Loss Report</h2>
<p style="text-align:center;">From <span th:text="${fromDate}"></span> To <span th:text="${toDate}"></span></p>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>SL#</th>
            <th>Invoice Number</th>
            <th>Invoice Date</th>
            <th>Product Name</th>
            <th>Sold Qty</th>
            <th>Purchase Price</th>
            <th>Selling Price</th>
            <th>Profit/Loss Amount</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="od, iterStat : ${details}">
            <td th:text="${iterStat.count}"></td>
            <td th:text="${od.invoiceNumber}"></td>
            <td th:text="${od.invoiceDate}"></td>
            <td th:text="${od.productName}"></td>
            <td th:text="${od.soldQty}"></td>
            <td th:text="${#numbers.formatDecimal(od.purchasePrice, 1, 2)}"></td>
            <td th:text="${#numbers.formatDecimal(od.sellingPrice, 1, 2)}"></td>
            <td th:text="${#numbers.formatDecimal(od.profitAmount, 1, 2)}"></td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td colspan="5" style="text-align:right">Total:</td>
            <td th:text="${#numbers.formatDecimal(totalPurchase, 1, 2)}"></td>
            <td th:text="${#numbers.formatDecimal(totalSelling, 1, 2)}"></td>
            <td th:text="${#numbers.formatDecimal(totalProfit, 1, 2)}"></td>
        </tr>
    </tfoot>
</table>

</body>
</html>
