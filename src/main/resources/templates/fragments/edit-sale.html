<!DOCTYPE html>
<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .summary-card {
            transition: transform 0.2s;
        }
        .summary-card:hover {
            transform: scale(1.02);
        }
        table input {
            width: 90px;
            text-align: right;
        }
        .invoice-summary td {
            font-weight: bold;
        }
        .btn-action {
            padding: 2px 8px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="bg-light">
<div layout:fragment="content" class="container align-self-center">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Edit Invoice</h4>
        <a href="/orders" class="btn btn-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back to Sales
        </a>
    </div>

    <!-- Form -->
    <form id="editInvoiceForm" th:action="@{/update-sale}" method="post">
        <input type="hidden" name="id" th:value="${saleOrder.id}" />

        <!-- Customer & Payment Info -->
        <div class="row mb-3">
            <div class="col-md-4">
                <label>Customer Name</label>
                <input type="text" class="form-control" name="customerName"
                       th:value="${saleOrder.customer.name}" required>
            </div>
            <div class="col-md-4">
                <label>Order Date</label>
                <input type="date" class="form-control" name="dateOrdered"
                       th:value="${formattedOrderDate}" required>
            </div>
            <div class="col-md-4">
                <label>Payment Method</label>
                <select class="form-select" name="paymentMethod" required>
                    <option value="CASH" th:selected="${saleOrder.paymentMethod == 'CASH'}">Cash</option>
                    <option value="BANK" th:selected="${saleOrder.paymentMethod == 'BANK'}">Bank</option>
                    <option value="MOBILE" th:selected="${saleOrder.paymentMethod == 'MOBILE'}">Mobile</option>
                </select>
            </div>
        </div>

        <!-- Product Table -->
        <div class="table-responsive mb-3">
            <table class="table table-bordered table-striped align-middle" id="productTable">
                <thead class="table-dark text-center">
                <tr>
                    <th>Product</th>
                    <th>Unit Price</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="detail : ${orderDetails}">
                    <td>
                        <input type="hidden" name="productId[]" th:value="${detail.product.id}">
                        <span th:text="${detail.product.name}"></span>
                    </td>
                    <td><input type="number" step="0.01" class="form-control price"
                               name="unitPrice[]" th:value="${detail.unitPrice}"></td>
                    <td><input type="number" class="form-control qty"
                               name="quantity[]" th:value="${detail.quantity}"></td>
                    <td><input type="text" readonly class="form-control total"
                               name="total[]" th:value="${detail.totalPrice}"></td>
                    <td class="text-center">
                        <button type="button" class="btn btn-danger btn-sm btn-remove-row">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Add Product Button -->
        <div class="mb-3">
            <button type="button" id="addRowBtn" class="btn btn-outline-dark btn-sm">
                <i class="bi bi-plus-circle"></i> Add Product
            </button>
        </div>

        <!-- Summary Section -->
        <div class="card shadow-sm summary-card p-3 mb-3">
            <div class="row g-3">
                <div class="col-md-3">
                    <label>Sub Total</label>
                    <input type="text" class="form-control" id="subTotal" readonly>
                </div>
                <div class="col-md-3">
                    <label>Discount</label>
                    <input type="number" step="0.01" class="form-control" id="discount"
                           name="discount" th:value="${saleOrder.discount}">
                </div>
                <div class="col-md-3">
                    <label>Grand Total</label>
                    <input type="text" class="form-control" id="grandTotal" name="grandTotal"
                           th:value="${saleOrder.grandTotal}" readonly>
                </div>
                <div class="col-md-3">
                    <label>Amount Paid</label>
                    <input type="number" step="0.01" class="form-control" id="amountPaid" name="amountPaid"
                           th:value="${saleOrder.amountPaid}">
                </div>
                <div class="col-md-3">
                    <label>Amount Due</label>
                    <input type="text" class="form-control" id="amountDue" readonly>
                </div>
                <div class="col-md-3">
                    <label>Financial Account</label>
                    <select class="form-select" name="financialAccountId">
                        <option th:each="acc : ${financialAccounts}"
						        th:value="${acc.id}"
						        th:text="${acc.finAccName}">
						</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Warranty & Guarantee -->
        <div class="row mb-4 g-3">
            <div class="col-md-6">
                <label>Warranty Period (Months)</label>
                <input type="number" class="form-control" name="warrantyPeriod"
                       th:value="${saleOrder.warrantyPeriod}">
            </div>
            <div class="col-md-6">
                <label>Warranty Description</label>
                <input type="text" class="form-control" name="warrantyDescription"
                       th:value="${saleOrder.warrantyDescription}">
            </div>
            <div class="col-md-6">
                <label>Guarantee Period (Months)</label>
                <input type="number" class="form-control" name="guaranteePeriod"
                       th:value="${saleOrder.guaranteePeriod}">
            </div>
            <div class="col-md-6">
                <label>Guarantee Description</label>
                <input type="text" class="form-control" name="guaranteeDescription"
                       th:value="${saleOrder.guaranteeDescription}">
            </div>
        </div>

        <!-- Submit -->
        <div class="text-end mb-4">
            <button type="submit" class="btn btn-success px-4">
                <i class="bi bi-save"></i> Update Invoice
            </button>
        </div>
    </form>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function() {

    // Recalculate totals
    function recalcTotals() {
        let subTotal = 0;
        $("#productTable tbody tr").each(function() {
            const qty = parseFloat($(this).find(".qty").val()) || 0;
            const price = parseFloat($(this).find(".price").val()) || 0;
            const total = qty * price;
            $(this).find(".total").val(total.toFixed(2));
            subTotal += total;
        });

        $("#subTotal").val(subTotal.toFixed(2));

        const discount = parseFloat($("#discount").val()) || 0;
        const grandTotal = subTotal - discount;
        $("#grandTotal").val(grandTotal.toFixed(2));

        const paid = parseFloat($("#amountPaid").val()) || 0;
        $("#amountDue").val(Math.max(grandTotal - paid, 0).toFixed(2));
    }

    $(document).on("input", ".qty, .price, #discount, #amountPaid", recalcTotals);

    // Remove row
    $(document).on("click", ".btn-remove-row", function() {
        $(this).closest("tr").remove();
        recalcTotals();
    });

    // Add new row
    $("#addRowBtn").click(function() {
        const row = `
            <tr>
                <td>
                    <select class="form-select" name="productId[]">
                        <option value="">-- Select Product --</option>
                        <option th:each="p : ${products}" th:value="\${p.id}" th:text="\${p.name}"></option>
                    </select>
                </td>
                <td><input type="number" step="0.01" class="form-control price" name="unitPrice[]" value="0"></td>
                <td><input type="number" class="form-control qty" name="quantity[]" value="1"></td>
                <td><input type="text" readonly class="form-control total" name="total[]" value="0.00"></td>
                <td class="text-center">
                    <button type="button" class="btn btn-danger btn-sm btn-remove-row"><i class="bi bi-trash"></i></button>
                </td>
            </tr>`;
        $("#productTable tbody").append(row);
    });

    // Initial calculation
    recalcTotals();
});
</script>
</body>
</html>
